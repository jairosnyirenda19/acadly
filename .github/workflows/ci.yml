name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · style, types, structure, tests, contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app.backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: acadly_db
      DB_TEST_DATABASE: acadly_test_db
      DB_USERNAME: acadly_app
      DB_PASSWORD: ci-app
      DB_OWNER_USERNAME: acadly_owner
      DB_OWNER_PASSWORD: ci-owner
      PGPASSWORD: ci-admin
    steps:
      - uses: actions/checkout@v4

      - name: Database roles and databases
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE acadly_owner LOGIN PASSWORD 'ci-owner' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE acadly_app LOGIN PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE acadly_db OWNER acadly_owner;
          CREATE DATABASE acadly_test_db OWNER acadly_owner;
          SQL
          for db in acadly_db acadly_test_db; do
            psql -h 127.0.0.1 -U postgres -d "$db" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS btree_gin; ALTER SCHEMA public OWNER TO acadly_owner; GRANT USAGE ON SCHEMA public TO acadly_app;"
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, redis, intl, sodium, zip
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - name: Style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Structure (acadly:lint)
        run: php artisan acadly:lint

      - name: Tests (features and layer rules)
        run: php artisan test

      - name: The contract is up to date
        run: |
          php artisan scramble:export --path=../contracts/openapi.json
          git diff --exit-code -- ../contracts/openapi.json

  web:
    name: Web · client, types, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app.frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      - name: Client, types, lint, tests, build
        run: pnpm check

      - name: The generated client is up to date
        run: git diff --exit-code -- packages/api-client/src/schema.d.ts
