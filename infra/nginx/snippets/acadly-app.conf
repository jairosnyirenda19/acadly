# Shared by the three app hosts of a school (D-112). Copy to /etc/nginx/snippets/.
# Each server block sets two variables before including it:
#   set $acadly_school "sunrise";      the folder /srv/acadly/sunrise and the socket /run/php/acadly-sunrise.sock
#   set $acadly_permissions "...";     which device features the app may ask for

server_tokens off;
client_max_body_size 55m;   # ACADLY_DOCUMENTS_MAX_UPLOAD_BYTES (50 MB) and the form around it

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_timeout 1d;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# The API: every /api/ request goes to the school's Laravel front controller.
# Document answers carry their own Content-Security-Policy (sandboxed); the
# console shows result pages from here in a frame, so only this site may frame it.
location ^~ /api/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/acadly/$acadly_school/current/app.backend/public/index.php;
    fastcgi_param HTTPS on;
    fastcgi_pass unix:/run/php/acadly-$acadly_school.sock;
    fastcgi_read_timeout 120s;
    fastcgi_hide_header X-Powered-By;
}

# Built files carry a hash in their name: kept for a year.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Every other path opens the app, which reads the address itself. index.html is never
# cached, so a release reaches every phone on its next visit.
location / {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy $acadly_permissions always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri /index.html;
}

# Nothing hidden is ever served.
location ~ /\. { deny all; }
